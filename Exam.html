<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial;
            width: 500px;
            margin: 100px auto;
        }
        input, button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 20px;
        }
        .login {
            background: #0866ff;
            color: white;
            border: none;
            font-size: 18px;
        }
        .create {
            background: white;
            color: #0866ff;
            border: 1px solid #0866ff;
        }
        a {
            display: block;
            text-align: center;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h2>Log in</h2>
    <input type="text" placeholder="Email address or mobile number">
    <input type="password" placeholder="Password">
    <button class="login">Log in</button>
    <a href="#">Forgotten password?</a>
    <button class="create">Create new account</button>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
        }
        .linear-gradient{
            background: linear-gradient(to right, black, rgb(231, 97, 119));
        } 
        .radial-gradient{
            background: radial-gradient(circle,black, rgb(231, 97, 119));
        }
        .conic-gradient{
            background: conic-gradient(black, rgb(231, 97, 119));
        } 
    </style>
</head>
<body>
    <div class="box linear-gradient"></div> 
    <br>
    <div class="box radial-gradient"></div> 
    <br>
    <div class="box conic-gradient"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style_reg.css">

</head>
<body>
    <h1 style="text-align:center;">Student Registration Form</h1>
    <form action="">
        <label for="Roll_no"> Roll no. :</label>
        <input type="text" name="Roll_no." id="Roll_no." placeholder="Enter your Roll_no">
        <br><br>

        <label for="Student name">Student name:</label>
        <input type="text" name="Student name" id="Student name" placeholder="Enter your name" required>
        <br><br>

        <label for="Father's name">Father's name:</label>
        <input type="text" name="Father's name" id="Father's name" placeholder="Enter your Father's name">
        <br><br>

        <label for="Date of Birth">Date of Birth:</label>
        <input type="date" name="date" id="Date of Birth">
        <br><br>

        <label for="Mobile">Mobile no. :</label>
        <select name="country_code" id="country_code">
            <option value="+91">+91</option>
            <option value="+45">+45</option>
            <option value="11">11</option>
        </select>
        <input type="tel" name="Mobile" id="Mobile" placeholder="mobile number">
        <br><br>

        <label for="Email_id">Email id:</label>
        <input type="email" name="Email_id" id="Email_id" placeholder="Enter your email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter password">
        <br><br>

        <label for="gender">Gender:</label>
    
        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>
        <br><br>

        <label for="department">Department:</label>
        <select name="department" id="department" required>
            <option value="">Select Department</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="civil">civil</option>
            <option value="Mech">Mech</option>
        </select>
        <br><br>

        <label for="course">Course:</label>
        <select name="course" id="course">
            <option value="">Select Course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
        </select>
        <br><br>

        <label for="skills">Skills:</label>
        
        <input type="checkbox" name="skills" id="html">
        <label for="html">HTML</label>

        <input type="checkbox" name="skills" id="css">
        <label for="css">CSS</label>

        <input type="checkbox" name="skills" id="java">
        <label for="java">Java</label>

        <input type="checkbox" name="skills" id="python">
        <label for="python">Python</label>
        <br><br>

        <label for="photo">Student photo:</label>
        <input type="file" name="photo" id="photo">
        <br><br>

        <label for="city">City:</label>
        <select name="city" id="city">
            <option value="">Select city</option>
            <option value="Mathura">Mathura</option>
            <option value="Agra">Agra</option>
            <option value="Hathras">Hathras</option>
            <option value="Delhi">Delhi</option>
        </select>
        <br><br>

        <label for="address">Address:</label>
        <textarea name="address" id="address" rows="4" cols="40" placeholder="Enter your Address"></textarea>
        <br><br> 

        <button type="reset" class="reset">Reset</button>
        <button type="submit" class="submit">Submit</button>
    </form>

</body>
</html>
